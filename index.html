<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Toán THCS</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-[#1e293b] rounded-2xl p-6 shadow-2xl border border-slate-700">
        <!-- Header -->
        <div class="flex justify-between items-start mb-6">
            <div>
                <h1 class="text-2xl font-bold text-white mb-1">Thử Thách Toán THCS</h1>
                <p class="text-slate-400 text-sm">Ôn tập kiến thức Toán Lớp 6 - 9 qua câu hỏi trắc nghiệm</p>
            </div>
            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-3 py-1.5 rounded-full font-medium">
                🏆 Cấp độ: THCS
            </span>
        </div>

        <!-- Question Section -->
        <div class="bg-[#0f172a]/50 rounded-xl p-6 border border-slate-800 mb-6">
            <div class="flex justify-between items-center mb-4">
                <span class="bg-blue-600/30 text-blue-400 text-xs px-3 py-1 rounded-md font-semibold">Lớp 8</span>
                <span id="question-count" class="text-slate-400 text-sm">Câu 1/3</span>
            </div>

            <!-- Nội dung câu hỏi -->
            <h2 id="question-text" class="text-xl font-medium text-slate-100 mb-6">
                <!-- Nội dung sẽ được chèn qua JavaScript -->
            </h2>

            <!-- Các lựa chọn đáp án -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Các nút đáp án sẽ được tạo tự động -->
            </div>
        </div>
    </div>

    <script>
        // Danh sách câu hỏi
        const questions = [
            {
                class: "Lớp 8",
                question: "Kết quả của hằng đẳng thức $(x + 3)^2$ là gì?",
                options: [
                    "A. $x^2 + 9$",
                    "B. $x^2 + 6x + 9$",
                    "C. $x^2 + 3x + 9$",
                    "D. $x^2 + 6x + 6$"
                ],
                correct: 1
            }
        ];

        let currentQuestion = 0;

        // Hàm render câu hỏi & toán học
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById("question-text").innerHTML = q.question;
            
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-xl bg-[#1e293b] hover:bg-slate-700/80 border border-slate-700 transition duration-200 text-slate-200 font-medium";
                btn.innerHTML = opt;
                optionsContainer.appendChild(btn);
            });

            // Tự động tìm và render các chuỗi dạng $...$ thành công thức toán đẹp mắt
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        // Tải câu hỏi khi trang web sẵn sàng
        document.addEventListener("DOMContentLoaded", () => {
            // Chờ KaTeX load xong rồi mới render
            setTimeout(loadQuestion, 100);
        });
    </script>
</body>
</html>
